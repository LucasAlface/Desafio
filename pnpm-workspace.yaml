packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
permissions:
  '@prisma/orm-postgres':
    skills: true
  '@scarf/scarf':
    build: true
  bcrypt:
    build: true
  prisma:
    skills: true
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .github/skills
